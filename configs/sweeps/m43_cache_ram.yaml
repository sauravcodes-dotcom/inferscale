# What does the host prompt cache (llama.cpp --cache-ram, MiB) buy on BFCL evaluation traffic,
# and what does it cost in memory? The first BFCL dev run used llama.cpp's default (8192) and
# swapped 9.5 GB with the same wall time as later 1024 runs. 0 disables the host cache (in-slot
# KV reuse of a shared prefix still applies). ~25 min per variant.
name: m43_cache_ram
description: |
  Host prompt-cache size vs latency, prompt-token reuse and memory/swap, all 347 BFCL dev
  requests in evaluation order (Qwen3-8B Q4_K_M, 2 slots x 8192 tokens, gateway_validated).
experiment: configs/experiments/bfcl_cache.yaml
engine_profile: bfcl
report: reports/m43_cache_ram.md
variants:
  - {name: cache0, engine_env: {ENGINE_CACHE_RAM: "0"}}
  - {name: cache1024, engine_env: {ENGINE_CACHE_RAM: "1024"}}
  - {name: cache4096, engine_env: {ENGINE_CACHE_RAM: "4096"}}
  - {name: cache8192, description: llama.cpp default, engine_env: {ENGINE_CACHE_RAM: "8192"}}
