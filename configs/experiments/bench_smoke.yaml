# Pipeline smoke test only: NOT a result. Allowed on battery / dirty environment (warnings only).
name: bench_smoke
description: 10 requests at concurrency 1 and 2 through the gateway (smoke)
smoke: true
workload:
  dataset: pag
  split_file: splits/pag_v1.json
  partition: pool
  prompt: pag_v1
  response_format: json_schema
  n_requests: 10
  max_tokens: 1024
  temperature: 0
mode: closed
concurrency: [1, 2]
warmup: 1
repeats: 1
cooldown_s: 5
gateway_url: http://127.0.0.1:8000
engine_url: http://127.0.0.1:8081
engine_log: logs/engine.log
max_swap_growth_mb: 32
seed: 1234
report: reports/bench_smoke.md
preflight:
  enforce: false
  require_ac: true
  max_swap_mb_start: 64
  forbidden_processes: ["^Google Chrome( Helper.*)?$", "^Safari$", "^[Oo]llama.*"]
