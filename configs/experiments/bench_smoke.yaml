# Pipeline smoke test only: NOT a result. Allowed on battery / dirty environment (warnings only).
name: bench_smoke
description: 10 requests at concurrency 1 and 2 against gateway and engine (smoke)
smoke: true
workload:
  dataset: triage_v1
  split: dev
  prompt: triage_v1
  n_requests: 10
  max_tokens: 256
  temperature: 0
mode: closed
concurrency: [1, 2]
warmup: 1
repeats: 1
cooldown_s: 5
targets: [gateway, engine]
gateway_url: http://127.0.0.1:8000
engine_url: http://127.0.0.1:8081
engine_log: logs/engine.log
max_swap_growth_mb: 32
seed: 1234
report: reports/bench_smoke.md
preflight:
  enforce: false
  require_ac: true
  max_swap_mb_start: 64
  require_reviewed_dataset: true
  forbidden_processes: ["^Google Chrome( Helper.*)?$", "^Safari$", "^[Oo]llama.*"]
