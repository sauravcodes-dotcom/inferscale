# E1 baseline: single-stream serving latency of qwen3-8b-q4km-v1 on the M1 Pro through the
# InferScale gateway, using PAG pool-partition inputs with the pag_v1 prompt.
# Preconditions (enforced by preflight): fresh restart, AC power, swap <= 64 MB,
# no Chrome/Safari/Ollama.
name: e1_baseline
description: Single-stream baseline through the gateway, PAG pool prompts (pag_v1, json_schema)
workload:
  dataset: pag
  split_file: splits/pag_v1.json
  partition: pool          # never the test partition
  prompt: pag_v1
  response_format: json_schema
  n_requests: 50           # per repeat; ~25 s per request at 1024 max tokens
  max_tokens: 1024
  temperature: 0
mode: closed
concurrency: [1]
warmup: 5
repeats: 3
cooldown_s: 120
gateway_url: http://127.0.0.1:8000
engine_url: http://127.0.0.1:8081
engine_log: logs/engine.log
max_swap_growth_mb: 32
seed: 1234
report: reports/e1_baseline.md
preflight:
  enforce: true
  require_ac: true
  max_swap_mb_start: 64
  forbidden_processes: ["^Google Chrome( Helper.*)?$", "^Safari$", "^[Oo]llama.*"]
